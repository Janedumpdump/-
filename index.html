<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測一測你是哪種人 - 孟子四端大冒險</title>
    <!-- 引入外部資源：Tailwind CSS 與 Anime.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glowing-text {
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
        }
        .btn-option {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-option:hover:not(:disabled) {
            transform: translateX(5px);
            background: rgba(51, 65, 85, 0.9);
            border-color: #fbbf24;
            box-shadow: -4px 0 0 #fbbf24;
        }
        .btn-option:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-glow-c { box-shadow: 0 0 12px #f43f5e; }
        .progress-glow-s { box-shadow: 0 0 12px #eab308; }
        .progress-glow-r { box-shadow: 0 0 12px #10b981; }
        .progress-glow-j { box-shadow: 0 0 12px #3b82f6; }
        .glitch-effect { animation: glitch 1s linear infinite; }
        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- 進度條容器 -->
    <div id="stats-container" class="w-full max-w-3xl glass-panel rounded-xl p-4 mb-6 hidden z-10 sticky top-4">
        <h2 class="text-center text-sm text-gray-400 mb-3 tracking-widest">【 四端之火 】</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="flex flex-col">
                <div class="flex justify-between text-xs mb-1"><span class="text-rose-400 font-bold">惻隱 (仁)</span><span id="val-c">50%</span></div>
                <div class="w-full bg-gray-700 rounded-full h-2"><div id="bar-c" class="bg-rose-500 h-2 rounded-full progress-glow-c" style="width: 50%"></div></div>
            </div>
            <div class="flex flex-col">
                <div class="flex justify-between text-xs mb-1"><span class="text-yellow-400 font-bold">羞惡 (義)</span><span id="val-s">50%</span></div>
                <div class="w-full bg-gray-700 rounded-full h-2"><div id="bar-s" class="bg-yellow-500 h-2 rounded-full progress-glow-s" style="width: 50%"></div></div>
            </div>
            <div class="flex flex-col">
                <div class="flex justify-between text-xs mb-1"><span class="text-emerald-400 font-bold">辭讓 (禮)</span><span id="val-r">50%</span></div>
                <div class="w-full bg-gray-700 rounded-full h-2"><div id="bar-r" class="bg-emerald-500 h-2 rounded-full progress-glow-r" style="width: 50%"></div></div>
            </div>
            <div class="flex flex-col">
                <div class="flex justify-between text-xs mb-1"><span class="text-blue-400 font-bold">是非 (智)</span><span id="val-j">50%</span></div>
                <div class="w-full bg-gray-700 rounded-full h-2"><div id="bar-j" class="bg-blue-500 h-2 rounded-full progress-glow-j" style="width: 50%"></div></div>
            </div>
        </div>
    </div>

    <!-- 遊戲主區域 -->
    <div id="main-area" class="w-full max-w-3xl flex-grow flex flex-col justify-center">
        <!-- 內容由 JS 動態生成 -->
    </div>

    const app = document.getElementById('main-area');
    const statsContainer = document.getElementById('stats-container');

    // 渲染首頁
    function renderStartScreen() {
        app.innerHTML = `
            <div class="glass-panel p-8 rounded-2xl text-center shadow-2xl relative overflow-hidden">
                <h1 class="text-4xl font-black mb-4 glowing-text">《測一測你是哪種人》</h1>
                <p class="text-xl text-gray-300 mb-8">孟子「四端」大冒險</p>

                <!-- 【小白替換圖片區 - 首頁】 -->
                <!-- 請將下面 src 裡面的網址換成你自己的圖片網址 -->
                <div class="mb-8 rounded-xl overflow-hidden border-2 border-slate-600 h-48 md:h-64 flex items-center justify-center bg-slate-800">
                    <img src="https://via.placeholder.com/800x400/334155/fbbf24?text=點擊代碼更換：首頁封面圖片" alt="封面圖" class="w-full h-full object-cover" />
                </div>
                <!-- 替換圖片區結束 -->

                <button onclick="startGame()" class="bg-yellow-500 text-slate-900 font-bold py-4 px-12 rounded-full text-xl hover:scale-105 transition-all">開始測驗</button>
            </div>
        `;
    }

    function startGame() {
        statsContainer.classList.remove('hidden');
        currentCase = 0;
        renderCase();
    }

    // 渲染每一關
    function renderCase() {
        if (currentCase >= CASES.length) { renderEnding(); return; }
        isAnimating = false;
        const caseData = CASES[currentCase];

        app.innerHTML = `
            <div id="case-container" class="glass-panel p-6 md:p-8 rounded-2xl shadow-2xl relative">
                <div class="flex items-center justify-between mb-4 border-b border-gray-700 pb-4">
                    <h2 class="text-xl md:text-2xl font-bold text-yellow-400">${caseData.title}</h2>
                    <span class="text-xs bg-gray-700 text-gray-300 px-3 py-1 rounded-full">${currentCase + 1} / 15</span>
                </div>
                
                <p class="text-lg text-gray-200 mb-6 bg-slate-800/50 p-4 rounded-lg leading-relaxed">${caseData.situation}</p>
                
                <!-- 【小白替換圖片區 - 案件關卡】 -->
                <!-- 注意：關卡的圖片網址請到上方 CASES 陣列中的 imageUrl 修改 -->
                <div class="mb-6 rounded-xl overflow-hidden border-2 border-slate-600 h-48 md:h-64 flex items-center justify-center bg-slate-800">
                    <img src="${caseData.imageUrl}" alt="情境圖" class="w-full h-full object-cover" />
                </div>
                <!-- 替換圖片區結束 -->

                <div class="space-y-4 options-container">
                    ${caseData.options.map((opt, i) => `
                        <button onclick="handleOption(${i})" id="opt-btn-${i}" class="btn-option w-full text-left p-4 rounded-xl border border-gray-600 bg-gray-800/80 text-gray-200 flex items-start">
                            <span class="mr-2 text-yellow-500">◆</span>
                            <span>${opt.text}</span>
                        </button>
                    `).join('')}
                </div>

                <div id="feedback-overlay" class="hidden absolute inset-0 bg-slate-900/95 rounded-2xl flex flex-col items-center justify-center p-8 text-center z-20 backdrop-blur-sm border border-yellow-500/30">
                    <div class="text-4xl mb-4">📜</div>
                    <h3 class="text-yellow-400 font-bold text-xl mb-4">【孟子系統提示】</h3>
                    <p id="mencius-quote" class="text-xl md:text-2xl text-gray-100 leading-relaxed mb-8"></p>
                    <button onclick="nextCase()" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/50 font-bold py-3 px-10 rounded-full hover:scale-105 transition-all">繼續 →</button>
                </div>
            </div>
        `;
    }

    // 處理選項點擊與數值計算
    function handleOption(optionIndex) {
        if (isAnimating) return;
        isAnimating = true;

        // 鎖定按鈕並高亮被選中的
        document.querySelectorAll('.btn-option').forEach(btn => btn.disabled = true);
        document.getElementById(`opt-btn-${optionIndex}`).classList.add('bg-yellow-900/50', 'border-yellow-500');

        const caseData = CASES[currentCase];
        const effects = caseData.options[optionIndex].effects;

        // 處理全域 C 選項懲罰
        const isOptionC = optionIndex === 2;
        if (effects.globalPenalty || isOptionC) {
            STATS.c = Math.floor(STATS.c * 0.9);
            STATS.s = Math.floor(STATS.s * 0.9);
            STATS.r = Math.floor(STATS.r * 0.9);
            STATS.j = Math.floor(STATS.j * 0.9);
        }

        // 處理特殊狀態
        if (effects.all === 100) {
            STATS.c = 100; STATS.s = 100; STATS.r = 100; STATS.j = 100;
        } else if (effects.all === 0) {
            STATS.c = 0; STATS.s = 0; STATS.r = 0; STATS.j = 0;
        } else if (effects.pause) {
            // 停滯不變
        } else {
            // 常規加減
            const applyStatChange = (statKey, effectValue) => {
                if (effectValue === "zero") {
                    STATS[statKey] = 0;
                } else if (typeof effectValue === 'number') {
                    STATS[statKey] += effectValue;
                }
                STATS[statKey] = Math.max(0, Math.min(100, STATS[statKey]));
            };

            if (effects.c !== undefined) applyStatChange('c', effects.c);
            if (effects.s !== undefined) applyStatChange('s', effects.s);
            if (effects.r !== undefined) applyStatChange('r', effects.r);
            if (effects.j !== undefined) applyStatChange('j', effects.j);
        }

        updateUI();

        // 延遲顯示孟子提示
        setTimeout(() => {
            document.getElementById('mencius-quote').innerText = `「${caseData.mencius}」`;
            document.getElementById('feedback-overlay').classList.remove('hidden');
        }, 600);
    }

    // 更新進度條 UI 動畫
    function updateUI() {
        const duration = 800;
        anime({ targets: '#bar-c', width: STATS.c + '%', duration, easing: 'easeOutElastic(1, .8)' });
        anime({ targets: '#bar-s', width: STATS.s + '%', duration, easing: 'easeOutElastic(1, .8)' });
        anime({ targets: '#bar-r', width: STATS.r + '%', duration, easing: 'easeOutElastic(1, .8)' });
        anime({ targets: '#bar-j', width: STATS.j + '%', duration, easing: 'easeOutElastic(1, .8)' });

        document.getElementById('val-c').innerText = STATS.c + '%';
        document.getElementById('val-s').innerText = STATS.s + '%';
        document.getElementById('val-r').innerText = STATS.r + '%';
        document.getElementById('val-j').innerText = STATS.j + '%';
    }

    function nextCase() { 
        currentCase++; 
        renderCase(); 
    }

    // 渲染最終結局
    function renderEnding() { 
        statsContainer.classList.add('hidden');
        const avgScore = (STATS.c + STATS.s + STATS.r + STATS.j) / 4;
        const minScore = Math.min(STATS.c, STATS.s, STATS.r, STATS.j);
        
        let title, desc, animClass, emoji;

        if (avgScore >= 80 && minScore >= 60) {
            title = '【萬世聖人 / 一代亞聖】';
            desc = '「苟能充之，足以保四海！」你成功擴充了內心的四端，你的善良與智慧足以改變世界！';
            animClass = 'glowing-text';
            emoji = '🔥';
        } else if (avgScore <= 39 || minScore === 0) {
            title = '【自賊之人 / 禽獸無異】';
            desc = '孟子對你搖頭嘆息。你完全埋沒了天生的良知。沒有惻隱、羞惡、辭讓、是非之心，你和禽獸有什麼分別呢？趕快找回你的本心吧！';
            animClass = 'text-red-500 glass-shatter';
            emoji = '⚠️';
        } else {
            title = '【徘徊在道德邊緣的 NPC】';
            desc = '你有時係正義魔人，有時又變咗怕事嘅 NPC。你嘅「四端」而家處於一個極度 Emo 嘅狀態。快啲「擴而充之」滿血復活啦！';
            animClass = 'text-gray-300';
            emoji = '🤷';
        }

        app.innerHTML = `
            <div class="glass-panel p-8 text-center rounded-2xl shadow-2xl relative overflow-hidden">
                <div class="text-6xl mb-6">${emoji}</div>
                <h2 class="text-3xl font-black mb-6 ${animClass}">${title}</h2>
                
                <div class="bg-gray-800/80 p-6 rounded-xl mb-6 flex justify-center gap-6 flex-wrap border border-gray-700">
                    <div><div class="text-sm text-rose-400">惻隱</div><div class="text-2xl font-bold">${STATS.c}%</div></div>
                    <div><div class="text-sm text-yellow-400">羞惡</div><div class="text-2xl font-bold">${STATS.s}%</div></div>
                    <div><div class="text-sm text-emerald-400">辭讓</div><div class="text-2xl font-bold">${STATS.r}%</div></div>
                    <div><div class="text-sm text-blue-400">是非</div><div class="text-2xl font-bold">${STATS.j}%</div></div>
                </div>

                <div class="bg-slate-900/50 p-6 rounded-lg border-l-4 border-yellow-500 text-left mb-8">
                    <p class="text-lg text-gray-200">${desc}</p>
                </div>

                <button onclick="location.reload()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-full transition-all">🔄 重新開始測驗</button>
            </div>
        `; 
    }

    renderStartScreen();
</script>
</body>
</html>
